name: Commit messages

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional commit subjects
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Conventional commit subjects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bad=$(git log --format=%s "origin/${BASE_REF}..HEAD" --no-merges \
            | grep -vE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|wip)(\([^)]+\))?!?: .+' || true)
          if [ -n "$bad" ]; then
            echo "These commit subjects do not follow type(scope): subject:"
            echo "$bad"
            exit 1
          fi
