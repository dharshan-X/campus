name: Security checks

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "**/*.json"
      - ".github/workflows/security.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/linters.yml"
      - "pyproject.toml"
  push:
    branches:
      - develop
      - main
      - "release/**"
    paths:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "**/*.json"
      - ".github/workflows/security.yml"
      - "pyproject.toml"
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    env:
      SEMGREP_VERSION: "1.182.1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Configure tool paths
        run: echo "TOOL_VENV=${RUNNER_TEMP}/semgrep-venv" >> "$GITHUB_ENV"

      - name: Restore Semgrep environment
        id: semgrep
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.TOOL_VENV }}
          key: ${{ runner.os }}-${{ runner.arch }}-semgrep-v1-py${{ steps.python.outputs.python-version }}-${{ env.SEMGREP_VERSION }}

      - name: Install Semgrep
        if: steps.semgrep.outputs.cache-hit != 'true'
        run: |
          python -m venv "$TOOL_VENV"
          "$TOOL_VENV/bin/python" -m pip install "semgrep==${SEMGREP_VERSION}"

      - name: Save Semgrep environment
        if: steps.semgrep.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.TOOL_VENV }}
          key: ${{ runner.os }}-${{ runner.arch }}-semgrep-v1-py${{ steps.python.outputs.python-version }}-${{ env.SEMGREP_VERSION }}

      - name: Download Frappe Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Semgrep
        run: >-
          "$TOOL_VENV/bin/semgrep" ci
          --config ./frappe-semgrep-rules/rules
          --config r/python.lang.correctness
