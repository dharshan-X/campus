name: Server Tests

# Performance-only replacement for develop at 2f14157.
# Keep the existing triggers, check name, database and test selection.
on:
  pull_request:
    paths:
      - "campus/**/*.py"
      - "campus/**/doctype/**/*.json"
      - "campus/**/report/**/*.json"
      - "campus/**/workspace/**/*.json"
      - ".github/helper/install.sh"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "**/requirements*.txt"
      - "scripts/**"
  push:
    branches:
      - develop
      - main
      - "release/**"
    paths:
      - "campus/**/*.py"
      - "campus/**/doctype/**/*.json"
      - "campus/**/report/**/*.json"
      - "campus/**/workspace/**/*.json"
      - ".github/helper/install.sh"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "**/requirements*.txt"
      - "scripts/**"
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
    inputs:
      full:
        description: Run the full suite
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FULL_SUITE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/'))) }}
  QUICK_MODULES: >-
    campus.tests.test_smoke
    campus.tests.test_navigation
    campus.tests.test_hardening
    campus.tests.test_pilot_roles
    campus.tests.test_student_portal
    campus.tests.test_admission_flow

jobs:
  tests:
    name: Server tests (${{ matrix.container }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Manual full=false and pull requests both use one quick-test runner.
        container: >-
          ${{ fromJSON(
            (github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.full) ||
            (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')))) &&
            '[1,2,3,4,5,6,7,8]' || '[1]'
          ) }}

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check for valid Python and merge conflicts
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}/campus"
          if git grep -n "^<<<<<<< " -- . ':(exclude)node_modules'; then
            echo "Found merge conflicts"
            exit 1
          fi

      - name: Set up Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # Prefer the runner's installed matching release.
          check-latest: false

      - name: Build download cache keys
        id: cache-keys
        env:
          PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
          NODE_VERSION: ${{ steps.node.outputs.node-version }}
          DEPENDENCY_HASH: ${{ hashFiles('.github/helper/install.sh', 'pyproject.toml', '**/requirements*.txt', '**/package.json', '**/yarn.lock', 'uv.lock') }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Set paths at step runtime: runner.temp is not a job-env context.
          {
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/campus-uv-cache"
            echo "PIP_CACHE_DIR=${RUNNER_TEMP}/campus-pip-cache"
            echo "YARN_CACHE_FOLDER=${RUNNER_TEMP}/campus-yarn-cache"
          } >> "$GITHUB_ENV"
          platform="${RUNNER_OS}-${RUNNER_ARCH}-bench-downloads-v1-py${PYTHON_VERSION}-node${NODE_VERSION}"
          {
            echo "platform=${platform}"
            echo "dependencies=${platform}-${DEPENDENCY_HASH}"
            echo "key=${platform}-${DEPENDENCY_HASH}-${RUN_ID}-${RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore dependency downloads
        id: downloads
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.PIP_CACHE_DIR }}
            ${{ env.YARN_CACHE_FOLDER }}
          key: ${{ steps.cache-keys.outputs.key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.dependencies }}-
            ${{ steps.cache-keys.outputs.platform }}-

      - name: Add to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
      - name: Install
        id: install
        timeout-minutes: 20
        run: |
          started=$(date +%s)
          bash "${GITHUB_WORKSPACE}/.github/helper/install.sh"
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
      
      - name: Prune uv downloads for cache storage
        if: matrix.container == 1
        continue-on-error: true
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv cache prune --ci
          fi

      - name: Save dependency downloads
        # One writer per run; save before tests so a test failure does not
        # discard newly downloaded dependencies. uv/pip/Yarn still resolve
        # and install dependencies normally on every runner.
        if: matrix.container == 1 && steps.downloads.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.PIP_CACHE_DIR }}
            ${{ env.YARN_CACHE_FOLDER }}
          key: ${{ steps.cache-keys.outputs.key }}

      - name: Migrate
        id: migrate
        run: |
          started=$(date +%s)
          cd ~/frappe-bench
          bench --site test_site migrate
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"

      - name: Quick tests
        id: quick
        if: env.FULL_SUITE != 'true'
        run: |
          started=$(date +%s)
          cd ~/frappe-bench
          failed=""
          for module in $QUICK_MODULES; do
            bench --site test_site run-tests --app campus --module "$module" || failed="$failed $module"
          done
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            echo "Failed modules:$failed"
            exit 1
          fi

      - name: Full suite (part ${{ matrix.container }} of ${{ strategy.job-total }})
        id: full
        if: env.FULL_SUITE == 'true'
        run: |
          started=$(date +%s)
          cd ~/frappe-bench
          bench --site test_site run-parallel-tests --app campus \
            --total-builds ${{ strategy.job-total }} --build-number ${{ matrix.container }}
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"

      - name: Performance summary
        if: always()
        env:
          SHARD: ${{ matrix.container }}
          CACHE_MATCH: ${{ steps.downloads.outputs.cache-matched-key || 'miss' }}
          INSTALL_SECONDS: ${{ steps.install.outputs.seconds || 'not completed' }}
          MIGRATE_SECONDS: ${{ steps.migrate.outputs.seconds || 'not completed' }}
          TEST_SECONDS: ${{ steps.full.outputs.seconds || steps.quick.outputs.seconds || 'not completed' }}
        run: |
          {
            echo "### Server CI performance"
            echo ""
            echo "| Measurement | Value |"
            echo "| --- | --- |"
            echo "| Runner | ${SHARD} |"
            echo "| Full suite | ${FULL_SUITE} |"
            echo "| Dependency cache | ${CACHE_MATCH} |"
            echo "| Install seconds | ${INSTALL_SECONDS} |"
            echo "| Migrate seconds | ${MIGRATE_SECONDS} |"
            echo "| Test seconds | ${TEST_SECONDS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Performance budget alerts
        if: always()
        env:
          INSTALL_SECONDS: ${{ steps.install.outputs.seconds || '' }}
          MIGRATE_SECONDS: ${{ steps.migrate.outputs.seconds || '' }}
          TEST_SECONDS: ${{ steps.full.outputs.seconds || steps.quick.outputs.seconds || '' }}
        run: |
          test_budget=2400
          if [ "$FULL_SUITE" = "true" ]; then
            test_budget=7200
          fi
          check_budget() {
            label="$1"
            value="$2"
            budget="$3"
            if [[ "$value" =~ ^[0-9]+$ ]] && [ "$value" -gt "$budget" ]; then
              echo "::warning title=${label} regression::${label} took ${value}s, budget ${budget}s"
            fi
          }
          check_budget "Install" "$INSTALL_SECONDS" 900
          check_budget "Migrate" "$MIGRATE_SECONDS" 300
          check_budget "Tests" "$TEST_SECONDS" "$test_budget"

      - name: Bench log on failure
        if: failure()
        run: tail -n 200 ~/frappe-bench/bench_start.log || true
