name: Linters

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.json"
      - "**/*.toml"
      - "**/*.yml"
      - "**/*.yaml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/linters.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-24.04
    env:
      PRE_COMMIT_VERSION: "4.7.0"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Configure tool paths
        run: |
          {
            echo "PRE_COMMIT_HOME=${RUNNER_TEMP}/pre-commit-cache"
            echo "TOOL_VENV=${RUNNER_TEMP}/pre-commit-venv"
          } >> "$GITHUB_ENV"

      - name: Restore pre-commit and hook environments
        id: hooks
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ env.TOOL_VENV }}
            ${{ env.PRE_COMMIT_HOME }}
          key: ${{ runner.os }}-${{ runner.arch }}-precommit-v1-py${{ steps.python.outputs.python-version }}-${{ env.PRE_COMMIT_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Prepare pre-commit and hooks
        if: steps.hooks.outputs.cache-hit != 'true'
        run: |
          python -m venv "$TOOL_VENV"
          "$TOOL_VENV/bin/python" -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          "$TOOL_VENV/bin/pre-commit" install-hooks

      - name: Save pre-commit and hook environments
        # Tool preparation is cached even when later formatting checks fail.
        if: steps.hooks.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ env.TOOL_VENV }}
            ${{ env.PRE_COMMIT_HOME }}
          key: ${{ runner.os }}-${{ runner.arch }}-precommit-v1-py${{ steps.python.outputs.python-version }}-${{ env.PRE_COMMIT_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          SKIP: prettier,eslint
        run: >-
          "$TOOL_VENV/bin/pre-commit" run
          --show-diff-on-failure
          --color=always
          --from-ref "$BASE_REF"
          --to-ref "$HEAD_REF"
